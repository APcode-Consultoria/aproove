app:

  image:
    repository: "ghcr.io/andrepenteado/aproove/backend"
    tag: ""
    imagePullSecrets: "github-secret"

  port: 8080

  envVars:
    SPRING_PROFILES_ACTIVE: prod

  # Segredos vindos do Vault, materializados pelo Vault Secrets Operator a
  # partir do bloco `vault:` no fim deste arquivo. O valor de cada entrada é
  # "<Secret>/<chave>" — sem `app.secretName`, porque agora são dois Secrets,
  # um por caminho no cofre.
  envSecrets:
    APROOVE_DB_PASSWORD: aproove-db/DB_PASSWORD
    APROOVE_OIDC_CLIENT_SECRET: aproove-oidc/OIDC_CLIENT_SECRET

  livenessProbe: "/actuator/health/liveness"
  readinessProbe: "/actuator/health/readiness"

ingress:
  host: "sistemas.apcode.com.br"
  context: "/roove-backend"
  # TLS centralizado: cert do host sistemas.apcode.com.br emitido no namespace 'certs'
  # e refletido para aproove (Secret sistemas-apcode-tls). O Ingress não gerencia cert.
  tlsSecretName: sistemas-apcode-tls

authServer: "https://login.apcode.com.br/actuator/health/readiness"

# Segredos lidos do HashiCorp Vault em runtime (ver k3s/vso/ no apdevops).
# Pré-requisitos no cofre, uma vez por sistema, em k3s/vault/ do apdevops:
#   make policy VAULT_TOKEN=<root>          (aplica policies/vso-aproove.hcl)
#   make k8s-role NS=aproove VAULT_TOKEN=<root>
#
# Cada item vira um VaultStaticSecret + o Secret de mesmo nome no namespace, e
# uma rotação no Vault reinicia este backend sozinha (rolloutRestartTargets).
vault:
  enabled: true
  secrets:
    - name: aproove-db
      path: apcode/postgresql/aproove-dbuser
      keys:
        DB_PASSWORD: password
    - name: aproove-oidc
      path: k3s/aproove/oidc-client-secret
      keys:
        OIDC_CLIENT_SECRET: value
    # Credencial do registry (ghcr.io), o último Secret que ainda se criava
    # à mão neste namespace. O nome é o mesmo de antes, de propósito — ele diz
    # QUAL registry, e já são três em uso na casa. Em troca, o `github-secret`
    # criado à mão precisa ser apagado ANTES do primeiro deploy com esta
    # versão (`kubectl delete secret github-secret -n aproove`): o operador se
    # recusa a assumir um Secret que não criou.
    #
    # Tipo próprio e chave `.dockerconfigjson` porque é o que o kubelet aceita;
    # `restart: false` porque trocar a credencial não muda nada num pod já
    # rodando — a imagem dele já foi baixada.
    - name: github-secret
      path: k3s/registry/ghcr
      type: kubernetes.io/dockerconfigjson
      restart: false
      keys:
        .dockerconfigjson: dockerconfigjson
