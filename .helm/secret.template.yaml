# MODELO versionado do ÚNICO Secret que ainda se cria à mão neste namespace: o
# imagePullSecret do registry. Copie para .helm/secret.yaml (git-ignored),
# preencha e aplique com `make k8s-pre-init`.
#
# As senhas da aplicação saíram daqui: agora ficam no HashiCorp Vault
# (secret/apcode/postgresql/aproove-dbuser e secret/k3s/aproove/...) e são materializadas
# como Secret pelo Vault Secrets Operator, a partir do bloco `vault:` do
# values do backend. Se o seu .helm/secret.yaml local ainda tiver o Secret
# `aproove-secrets`, apague esse documento dele — aplicá-lo de novo recriaria um
# objeto que ninguém lê e que colide com o que o operador mantém.
# imagePullSecret do ghcr.io. .dockerconfigjson = base64 de:
# {"auths":{"ghcr.io":{"auth":"<base64 user:token>"}},"aliases":{"builder":"buildx"}}
apiVersion: v1
kind: Secret
metadata:
  name: github-secret
  namespace: aproove
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <base64-dockerconfigjson>
