crud:
  nome: paciente

autor: André Penteado

projeto:
  nome: roove
  perfis:
    - RooveApplication.PERFIL_FISIOTERAPEUTA:FISIOTERAPEUTA
    - RooveApplication.PERFIL_DIRETOR:DIRETOR

# Regras de negócio e de tela que o contrato declarativo não cobre. Cada uma diz, no
# próprio texto, se vale no service (e em qual) ou se é regra de tela do componente de
# cadastro do paciente.
regras:
  - nome: valor contratado só pelo diretor
    prompt: >
      Regra do service do serviço contratado. Ao incluir ou alterar um serviço
      contratado, se o usuário logado não tiver o perfil DIRETOR, descartar o valor
      contratado que veio no payload: na alteração, repor o valor do registro já
      gravado; na inclusão, gravar nulo. Na aba do cadastro, o campo aparece somente
      leitura para quem não é DIRETOR.
      Declarado aqui, e não como `edicao` no subcampo, porque `edicao` é rejeitado em
      `lista.campos` pelo contrato (01-yaml-contrato.md).

  - nome: encerrar contratação
    prompt: >
      Regra do service do serviço contratado. Encerrar uma contratação grava a data de
      hoje no fim da contratação, sem receber nenhum outro dado. Só é permitido quando
      o fim da contratação está vazio; já preenchido, recusar com erro de negócio. Na
      aba do cadastro, o botão de encerrar fica na primeira coluna da tabela, ao lado
      do excluir, e só aparece nas linhas cujo fim da contratação está vazio.

  - nome: campos de frequência conforme o serviço
    prompt: >
      Regra de tela, no cadastro do paciente. Ao escolher o serviço na aba de serviços
      contratados, gerar tantos controles de frequência quanto for o valor de
      `frequencia` do serviço escolhido. O tipo de cada controle vem da periodicidade
      dele. AVULSO: controle de data, porque não há recorrência — cada valor é o dia
      exato do atendimento. SEMANAL: combo com os dias da semana, gravando o nome da
      constante do enum DiaSemana (DOMINGO, SEGUNDA, TERCA, QUARTA, QUINTA, SEXTA,
      SABADO); o enum é criado por esta regra, e não por um bloco `enum` de campo,
      porque não é coluna própria — vive dentro da coluna `frequencia`. MENSAL: controle
      numérico de 1 a 31, o dia do mês. Cada controle de dia tem ao lado um controle de
      horário inicial. Os valores são concatenados e gravados em duas colunas únicas,
      `frequencia` e `horarios`, separados por ponto e vírgula e na mesma ordem. O
      horário final não é digitado nem gravado: a agenda o deriva somando `duracao` do
      serviço ao horário inicial.

  - nome: contratação avulsa nasce fechada
    prompt: >
      Regra do service do serviço contratado. Ao incluir ou alterar uma contratação de
      serviço com periodicidade AVULSO, derivar o período dela das datas gravadas na
      frequência: o início da contratação é a menor data e o fim, a maior. Vale também
      na alteração, senão reabrir um avulso seria só questão de gravar de novo. Se
      nenhuma data puder ser lida, preservar o que veio. A aba do cadastro deriva as
      mesmas duas datas enquanto o usuário escolhe, exibindo o início somente leitura e
      o fim como texto, mas quem decide é o service.
      Sem isso a contratação avulsa se comportaria como recorrente: ficaria "em vigor"
      para sempre e a regra "renovação ao pagar" geraria uma cobrança nova a cada
      quitação, sem nunca parar.

  - nome: pagamento gerado ao contratar
    prompt: >
      Regra do service do serviço contratado. Ao incluir um serviço contratado, gerar
      também um pagamento para ele. O vencimento é o dia de vencimento cadastrado no
      paciente, no mês do início da contratação, sem adiantar para o mês seguinte
      quando a data já passou — pode nascer vencido, e é o comportamento desejado. Se o
      paciente não tiver dia de vencimento, usar a própria data de início; se o dia não
      existir no mês, usar o último dia do mês. O valor é o valor contratado, e data e
      valor pagos nascem vazios.

  - nome: renovação ao pagar
    prompt: >
      Regra do service do pagamento. Ao alterar um pagamento que passa a ter data e
      valor pagos preenchidos, verificar a contratação dele: se o fim da contratação
      estiver vazio, gerar um novo pagamento para a mesma contratação, com vencimento
      um mês depois do vencimento do pagamento quitado — no dia de vencimento do
      paciente, ajustando para o último dia quando o mês for curto — e valor igual ao
      valor contratado. Contratação já encerrada não renova. A renovação é mensal
      independente da periodicidade do serviço, porque o dia de vencimento do paciente
      é um dia do mês.

  - nome: sem choque de horário
    prompt: >
      Regra do service do serviço contratado. Ao incluir ou alterar uma contratação,
      recusar quando algum atendimento dela cair sobre um atendimento que o
      fisioterapeuta responsável pelo paciente já tem. A verificação é sobre as
      ocorrências derivadas, e não sobre a coluna `frequencia`: dois valores de
      frequência podem significar a mesma data sem se parecerem — o dia 15 de um serviço
      MENSAL cai numa terça-feira em alguns meses, e é aí que ele choca com um SEMANAL de
      terça. Quem deriva as ocorrências é o mesmo método que monta a agenda, para a
      regra e a tela enxergarem os mesmos atendimentos.
      Dois atendimentos chocam quando caem no mesmo dia e as faixas [início, fim) se
      cruzam, com o fim derivado da `duracao` do serviço. Serviço sem duração cadastrada
      vira um instante, e aí só o mesmo horário de início é choque. Atendimento sem
      horário não choca com nada — a agenda o mostra como "sem horário" e não há faixa
      que se possa afirmar ocupada. Verificar também a contratação contra ela mesma: os
      N controles de frequência são preenchidos de uma vez e nada impede escolher duas
      terças às 08:00 no mesmo serviço.
      O responsável sai do paciente lido do banco, e a duração e a periodicidade saem do
      serviço lido do banco: verificar com os números que vieram no payload seria
      verificar com números escolhidos por quem está sendo verificado. A agenda
      consultada inclui contratação com fim preenchido, senão toda contratação AVULSO —
      que nasce fechada pela regra "contratação avulsa nasce fechada" — ficaria invisível
      para a verificação.
      Recorrência sem fim não tem como ser verificada até o infinito: a verificação olha
      12 meses a partir do início da contratação, ou o fim dela quando é mais curto. É o
      horizonte com que a clínica agenda; choque além disso só é checado quando a
      contratação de lá for feita.
      Erro de negócio (422), com o dia, o horário e o paciente do atendimento que já
      ocupa a faixa, para quem contrata saber o que remarcar.

  - nome: ação pagar na aba de pagamentos
    prompt: >
      Regra de tela, no cadastro do paciente. A aba de pagamentos não tem botão de
      adicionar: o pagamento nasce da contratação do serviço. Cada linha ainda não paga
      oferece a ação Pagar, que carrega o registro num formulário fora de modal, na
      própria aba, com data e valor pagos; confirmar grava aquele pagamento. Linha já
      paga não oferece a ação.

# ATENÇÃO — este YAML foi escrito DEPOIS do código, para documentar um CRUD que
# nasceu antes da spec e servir de modelo de `tipo: lista`. Divergências conhecidas
# entre o que a spec geraria e o que existe hoje no projeto, todas deliberadas:
#
# 1. Auditoria: a spec deriva `criado_por`/`criado_em`/`alterado_por`/`alterado_em`.
#    O paciente usa `usuario_cadastro`/`data_cadastro`/`usuario_ultima_atualizacao`/
#    `data_ultima_atualizacao`. Renomear exigiria migração de banco sem ganho — vale
#    a regra "padrões reais do projeto prevalecem" do orquestrador.
# 2. Exame e Prontuário têm só o `criado_por` da spec, sob os nomes que fazem par com
#    a data que cada um já tinha: `usuario_upload`/`data_upload` e `usuario_registro`/
#    `data_registro`. Nenhuma das duas listas permite alterar um registro depois de
#    criado — só incluir e excluir —, logo `alterado_por`/`alterado_em` não fazem
#    sentido aqui. Registros anteriores à migração 1.0.2 ficam nulos e a tela mostra
#    "Usuário não identificado" — o banco não sabe quem os criou, e inventar autoria
#    a partir de outro campo seria pior que admitir a lacuna.
#
#    REGRA: todo campo de auditoria de usuário grava o LOGIN
#    (`securityService.getUserLogin().getLogin()`), nunca o nome. O login é a
#    identidade estável do usuário — o nome pode mudar no provedor OIDC e não serve
#    como chave. É o mesmo valor que `paciente.responsavel` guarda, o que deixa os
#    dois campos comparáveis entre si.
#
#    PENDÊNCIA: as telas exibem o login como está. Resolver o nome a partir do login,
#    para exibição, é tarefa à parte — o banco não tem tabela de usuários, então
#    depende de consultar o provedor OIDC.
# 3. O projeto não usa Liquibase; o passo `02-backend-liquibase.md` não se aplica aqui.
# 4. Campos pesquisáveis: `nome`, `cpf`, `telefone` e `email`. A spec define os valores
#    `exato` e `contem`, e não `true`; como os quatro são texto, foram implementados
#    como `contem` — busca parcial, sem diferenciar maiúsculas de minúsculas. Trocar
#    para `pesquisavel: contem` no YAML deixaria o contrato explícito, sem mudar o
#    código gerado.
#    CPF e telefone são gravados só com dígitos, sem máscara, então o `PacienteFilter`
#    extrai os dígitos do valor recebido antes de comparar. A tela abre listando tudo
#    (não é tela de volume alto) e a busca rápida do DataTables continua valendo sobre
#    o resultado já filtrado pelo backend.
tabela:
  nome: paciente
  label: Paciente
  plural: Pacientes
  campos:
    - nome: id
      tipo: longo
      pk: true
      autoincremento: true
      exibe-grid: true

    # --- Dados principais ---
    - nome: nome
      tipo: texto
      label: Nome
      obrigatorio: true
      indice: true
      colunas-layout: 6
      exibe-grid: true
      pesquisavel: contem

    - nome: cpf
      # texto, e nao longo: o zero a esquerda e significativo e some no numerico
      tipo: texto
      label: CPF
      mask: "000.000.000-00"
      colunas-layout: 3
      exibe-grid: true
      pesquisavel: contem

    - nome: data_nascimento
      tipo: data
      label: Nascimento
      colunas-layout: 3*
      exibe-grid: false

    - nome: telefone
      tipo: texto
      label: Telefone
      # Duas alternativas: fixo tem 10 digitos e celular 11
      mask: "(00) 0000-0000||(00) 00000-0000"
      colunas-layout: 4
      exibe-grid: true
      pesquisavel: contem

    - nome: whatsapp
      tipo: booleano
      label: WhatsApp?
      colunas-layout: 2
      exibe-grid: false

    - nome: email
      tipo: texto
      label: E-mail
      colunas-layout: 6*
      exibe-grid: false
      pesquisavel: contem

    - nome: contato_emergencia
      tipo: texto
      label: Contato de emergência
      colunas-layout: 6
      exibe-grid: false

    - nome: parentesco_contato_emergencia
      tipo: texto
      label: Parentesco
      colunas-layout: 6*
      exibe-grid: false
      enum:
        nome: Parentesco
        valores:
          MARIDO: Marido
          ESPOSA: Esposa
          PAI: Pai
          MAE: Mãe
          TIO: Tio(a)
          FILHO: Filho(a)
          PRIMO: Primo(a)
          AVO: Avô(á)
          AMIGO: Amigo(a)

    - nome: profissao
      tipo: texto
      label: Profissão
      colunas-layout: 5
      exibe-grid: false

    - nome: dia_vencimento
      tipo: inteiro
      label: Dia de vencimento
      colunas-layout: 4*
      exibe-grid: false

    # Responsável pelo paciente. Só o perfil DIRETOR pode trocar o valor; a regra
    # está no PacienteService e não é expressável no contrato do YAML.
    - nome: responsavel
      tipo: texto
      label: Responsável
      colunas-layout: 12*
      exibe-grid: true

    # --- Endereço ---
    - nome: cep
      tipo: texto
      label: CEP
      mask: "00000-000"
      colunas-layout: 4
      exibe-grid: false

    - nome: logradouro
      tipo: texto
      label: Logradouro
      colunas-layout: 8*
      exibe-grid: false

    - nome: numero_logradouro
      tipo: inteiro
      label: Número
      colunas-layout: 3
      exibe-grid: false

    - nome: complemento
      tipo: texto
      label: Complemento
      colunas-layout: 5
      exibe-grid: false

    - nome: bairro
      tipo: texto
      label: Bairro
      colunas-layout: 4*
      exibe-grid: false

    - nome: cidade
      tipo: texto
      label: Cidade
      colunas-layout: 5
      exibe-grid: false

    - nome: estado
      tipo: texto
      label: UF
      colunas-layout: 2*
      exibe-grid: false

    # --- Informações clínicas ---
    - nome: queixa_principal
      tipo: texto3
      label: Queixa principal (QP)
      colunas-layout: 12*
      exibe-grid: false

    - nome: historia_molestia_pregressa
      tipo: texto3
      label: História Moléstia Pregressa (HMP)
      colunas-layout: 12*
      exibe-grid: false

    - nome: remedios
      tipo: texto3
      label: Remédios
      colunas-layout: 12*
      exibe-grid: false

    - nome: objetivos
      tipo: texto3
      label: Objetivos
      colunas-layout: 12*
      exibe-grid: false

    - nome: observacao
      tipo: texto3
      label: Observação
      colunas-layout: 12*
      exibe-grid: false

    # --- Listas ---
    # Ambas são 1:N (nenhum subcampo tem `fk`) e `persistencia: independente`:
    # exame e prontuário são registros de negócio próprios, consultados e auditados
    # fora da tela do paciente. Perder um atendimento porque o usuário não clicou em
    # Gravar na aba de dados cadastrais seria erro de domínio.
    #
    # `lista.tabela` é obrigatório aqui: o default seria `paciente_exames` e
    # `paciente_prontuarios`, mas as tabelas reais são `exame` e `prontuario`.
    # Divergência deliberada da spec: o grid desta lista não é uma tabela, e sim uma
    # galeria de cartões, um por anexo. O registro aqui é um arquivo, não um dado
    # tabular — o que importa é reconhecer o anexo e agir sobre ele (baixar/excluir),
    # não comparar linha a linha. Montada só com utilitários do Bootstrap.
    - nome: exames
      tipo: lista
      lista:
        label: Exames
        tabela: exame
        persistencia: independente
        formato: sem-modal
        campos:
          - nome: descricao
            tipo: texto
            label: Descrição
            obrigatorio: true
            colunas-layout: 6
            exibe-grid: true

          # Upload dentro de lista: coluna UUID para upload(uuid), UploadService no
          # frontend. Na tabela da lista aparece o nome do anexo com botão de download.
          - nome: arquivo
            tipo: arquivo
            label: Arquivo do exame
            obrigatorio: true
            colunas-layout: 6*
            exibe-grid: true

          # Preenchido pelo sistema na inclusão; oculto no formulário.
          - nome: data_upload
            tipo: data-hora
            label: Enviado em
            exibe-formulario: false
            exibe-grid: true

          # Auditoria: nome do usuário logado, gravado pelo ExameService na inclusão.
          # Nulo nos registros anteriores à coluna.
          - nome: usuario_upload
            tipo: texto
            label: Enviado por
            exibe-formulario: false
            exibe-grid: true

    # Divergência deliberada da spec: o grid desta lista não é uma tabela, e sim uma
    # linha do tempo (cada registro é um cartão com data/hora, autor e botão excluir).
    # O motivo é o `atendimento` ser texto longo: numa coluna de tabela ele apareceria
    # truncado, e o prontuário precisa ser lido inteiro. Montada só com utilitários do
    # Bootstrap; o único CSS próprio é `.text-prewrap`, em `styles.css`.
    - nome: prontuarios
      tipo: lista
      lista:
        label: Prontuário
        tabela: prontuario
        persistencia: independente
        formato: sem-modal
        campos:
          # Preenchido pelo sistema na inclusão; oculto no formulário.
          - nome: data_registro
            tipo: data-hora
            label: Data do registro
            obrigatorio: true
            exibe-formulario: false
            exibe-grid: true

          # Auditoria: nome do usuário logado, gravado pelo ProntuarioService na
          # inclusão. Nulo nos registros anteriores à coluna.
          - nome: usuario_registro
            tipo: texto
            label: Registrado por
            exibe-formulario: false
            exibe-grid: true

          - nome: atendimento
            tipo: texto5
            label: Atendimento
            obrigatorio: true
            colunas-layout: 12*
            exibe-grid: true

    # N:M entre paciente e serviço: há subcampo `fk` (servico), então a tabela
    # `servico_contratado` é a entidade intermediária, ligada por @OneToMany/@ManyToOne
    # — nunca @ManyToMany. `persistencia: independente` porque a contratação é registro
    # de negócio próprio: é gravada no "Contratar", consultada e auditada por si, e
    # perdê-la porque o usuário não clicou em Gravar seria erro de domínio.
    #
    # `acoes`: os dois perfis contratam e encerram; só o diretor exclui, porque excluir
    # apaga histórico de contratação.
    - nome: servicos_contratados
      tipo: lista
      lista:
        label: Serviços Contratados
        tabela: servico_contratado
        persistencia: independente
        formato: sem-modal
        acoes:
          consultar: [FISIOTERAPEUTA, DIRETOR]
          incluir: [FISIOTERAPEUTA, DIRETOR]
          alterar: [FISIOTERAPEUTA, DIRETOR]
          excluir: [DIRETOR]
        campos:
          - nome: servico
            tipo: longo
            label: Serviço
            fk: servico
            fk-display: nome
            obrigatorio: true
            colunas-layout: 6
            exibe-grid: true

          - nome: inicio_contratacao
            tipo: data
            label: Início da contratação
            obrigatorio: true
            colunas-layout: 3
            exibe-grid: true

          # Restrição de edição por perfil na regra "valor contratado só pelo diretor":
          # `edicao` é rejeitado em `lista.campos`.
          - nome: valor_contratado
            tipo: moeda
            label: Valor contratado
            colunas-layout: 3*
            exibe-grid: true

          # Preenchido pelo botão "Encerrar", nunca digitado no subformulário.
          - nome: fim_contratacao
            tipo: data
            label: Fim da contratação
            exibe-formulario: false
            exibe-grid: true

          # Coluna única com os N valores separados por ponto e vírgula. Os controles
          # que a alimentam são gerados pela regra "campos de frequência conforme o
          # serviço", porque a quantidade e o tipo dependem do serviço escolhido.
          - nome: frequencia
            tipo: texto
            label: Frequência
            exibe-formulario: false
            exibe-grid: true

          # Um horário por ocorrência da frequência, na mesma ordem. É o que permite
          # montar a agenda por fisioterapeuta.
          - nome: horarios
            tipo: texto
            label: Horários
            exibe-formulario: false
            exibe-grid: true

    # Pagamentos das contratações. É lista de `paciente`, e não de `servico_contratado`,
    # porque coleção dentro de coleção é rejeitada pelo contrato — e porque a aba mostra
    # os pagamentos do paciente inteiro, de todas as contratações. O vínculo com a
    # contratação é o subcampo `fk`.
    #
    # `independente`: o pagamento é gravado no momento da contratação e na ação Pagar,
    # nunca no Gravar do paciente. Perder um pagamento por falta de clique seria erro de
    # domínio.
    #
    # Não há botão de adicionar na aba: quem cria o registro é a regra "pagamento gerado
    # ao contratar". `incluir` fica com os dois perfis mesmo assim, porque é o service do
    # pagamento que grava, chamado a partir da contratação.
    - nome: pagamentos
      tipo: lista
      lista:
        label: Pagamentos
        tabela: pagamento
        persistencia: independente
        formato: sem-modal
        acoes:
          consultar: [FISIOTERAPEUTA, DIRETOR]
          incluir: [FISIOTERAPEUTA, DIRETOR]
          alterar: [FISIOTERAPEUTA, DIRETOR]
          excluir: [DIRETOR]
        campos:
          # A tabela da aba exibe o nome do serviço da contratação, não o id: `id` é só
          # o fallback de `fk-display`, porque ServicoContratado não tem label/nome.
          - nome: servico_contratado
            tipo: longo
            label: Contratação
            fk: servico_contratado
            fk-display: id
            obrigatorio: true
            exibe-formulario: false
            exibe-grid: true

          # Vencimento e valor vêm da contratação; o usuário não os digita.
          - nome: data_vencimento
            tipo: data
            label: Vencimento
            obrigatorio: true
            exibe-formulario: false
            exibe-grid: true

          - nome: valor
            tipo: moeda
            label: Valor
            exibe-formulario: false
            exibe-grid: true

          # Os dois campos do formulário da ação Pagar.
          - nome: data_pagamento
            tipo: data
            label: Data do pagamento
            colunas-layout: 6
            exibe-grid: true

          - nome: valor_pago
            tipo: moeda
            label: Valor pago
            colunas-layout: 6*
            exibe-grid: true
