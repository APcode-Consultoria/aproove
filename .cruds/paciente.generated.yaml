observacoes: >
  Só as listas servicos_contratados e pagamentos foram geradas: o restante do CRUD
  paciente é anterior à spec e não foi tocado. ServicoService.listar() passou a aceitar
  FISIOTERAPEUTA, para a aba popular o combo de serviços.
  O campo frequencia_semanal foi removido do contrato e a coluna correspondente é
  derrubada pela migration 1.0.4: quem define quantos atendimentos o paciente tem, e
  quando, passou a ser a frequência do serviço contratado.
  O enum DiaSemana nasce da regra "campos de frequência conforme o serviço", e não de um
  bloco `enum` de campo, porque não é coluna própria — os valores vivem dentro da coluna
  `frequencia` da contratação.
  A regra "contratação avulsa nasce fechada" deriva início e fim das datas escolhidas:
  sem ela o avulso ficaria em vigor para sempre e a renovação de pagamento não pararia.
