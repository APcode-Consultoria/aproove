crud:
  nome: servico

autor: André Penteado

projeto:
  nome: roove
  perfis:
    - RooveApplication.PERFIL_DIRETOR:DIRETOR

tabela:
  nome: servico
  label: Serviço
  plural: Serviços
  campos:
    - nome: id
      tipo: longo
      pk: true
      autoincremento: true
      exibe-grid: true

    - nome: nome
      tipo: texto
      label: Nome
      obrigatorio: true
      indice: true
      colunas-layout: 12
      exibe-grid: true
      pesquisavel: contem

    - nome: duracao
      tipo: inteiro
      label: Duração (em minutos)
      colunas-layout: 4

    - nome: valor
      tipo: moeda
      label: Valor
      colunas-layout: 4
      exibe-grid: true

    - nome: frequencia
      tipo: inteiro
      label: Frequência
      colunas-layout: 4*

    - nome: periodicidade
      tipo: texto
      label: Periodicidade
      colunas-layout: 12*
      exibe-grid: true
      pesquisavel: exato
      enum:
        nome: Periodicidade
        valores:
          AVULSO: Avulso (Pontual)
          SEMANAL: Semanal
          MENSAL: Mensal
