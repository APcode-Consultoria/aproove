spring:

  application:
    name: roove

  datasource:
    url: jdbc:postgresql://db.apcode.com.br/aproove-dbname
    username: aproove-dbuser
    password: ${APROOVE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: aproove-pool
      initializationFailTimeout: 0
      connectionTimeout: 30000

  jpa:
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        enable_lazy_load_no_trans: true

  security:
    oauth2:
      client:
        registration:
          "[com.github.andrepenteado.roove]":
            provider: com.github.andrepenteado.sso.portal
            client-name: AProove
            client-id: PRODUCAO-roove
            client-secret: ${APROOVE_OIDC_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            scope: openid
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_basic
          # Registro M2M (client_credentials) reutilizando o MESMO client/secret do login,
          # usado para consultar a api do apsso (ex.: foto do usuário).
          roove-api:
            provider: com.github.andrepenteado.sso.portal
            client-id: PRODUCAO-roove
            client-secret: ${APROOVE_OIDC_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            scope: com.github.andrepenteado.sso.api_CONSULTAR_API
            client-authentication-method: client_secret_basic
        provider:
          "[com.github.andrepenteado.sso.portal]":
            issuer-uri: https://login.apcode.com.br
  web:
    error:
      include-message: always

# URL base da api de consulta do apsso (resource server). Override por env conforme o deploy.
apsso:
  api:
    base-url: ${APSSO_API_BASE_URL:https://sistemas.apcode.com.br/api}

server:
  forward-headers-strategy: framework
  port: 8080
  servlet:
    context-path: /roove-backend
    session:
      cookie:
        same-site: lax
        http-only: true
        secure: true
        name: roove-backend-session
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include:
          - prometheus
          - health
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://sistemas.apcode.com.br:9411

frontend:
  base-url: https://sistemas.apcode.com.br # CORS
  base-path: /roove